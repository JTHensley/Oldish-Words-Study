<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Oldish Words Study</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #fffdf8; --ink: #2a2622; --muted: #6b6359;
    --line: #d9d2c4; --hit: #2f7d4f; --build: #b4691f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --card: #26231f; --ink: #ece6da; --muted: #a39a8c;
      --line: #3a362f; --hit: #5fb882; --build: #e0954a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 12px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .controls input[type=search] { grid-column: 1 / -1; }
  input, select { width: 100%; padding: 10px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .count { color: var(--muted); font-size: .9rem; margin: 8px 0; }
  .card { background: var(--card); border: 1px solid var(--line);
    border-left: 6px solid var(--hit); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
  .card.build { border-left-color: var(--build); border-left-style: dashed; }
  .term { font-size: 1.2rem; font-weight: bold; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .9rem; margin: 2px 0 8px; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: .75rem;
    font-weight: bold; letter-spacing: .04em; color: #fff; background: var(--hit); }
  .build .badge { background: var(--build); }
  .field { margin: 4px 0; overflow-wrap: anywhere; }
  .field a { color: inherit; text-decoration: underline; overflow-wrap: anywhere; }
  .field b { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .quote { font-style: italic; border-left: 3px solid var(--line); padding-left: 10px; margin: 6px 0; }
  .foot { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line);
    text-align: right; font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .foot div + div { margin-top: 2px; }
  .switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-bottom: 12px;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .switch button { padding: 10px 6px; font: inherit; color: var(--ink); background: var(--card);
    border: 0; cursor: pointer; overflow-wrap: anywhere; }
  .switch button + button { border-left: 1px solid var(--line); }
  .switch button[aria-pressed=true] { background: var(--ink); color: var(--bg); font-weight: bold; }
  .controls.three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 520px) { .controls.three { grid-template-columns: 1fr 1fr; }
    .controls.three select:last-child { grid-column: 1 / -1; } }
  .group { margin-bottom: 18px; }
  .group h2 { font-size: 1.1rem; margin: 0 0 8px; overflow-wrap: anywhere; }
  .opt { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--muted);
    border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; }
  .opt .term { font-size: 1.1rem; }
  .letter { font-size: 1.3rem; font-weight: bold; margin: 22px 0 8px; padding-bottom: 2px;
    border-bottom: 2px solid var(--line); }
  .opt.flash { outline: 3px solid var(--ink); }
  .field a { overflow-wrap: anywhere; }
  .opt .note { color: var(--muted); font-size: .9rem; }
  .word .part + .part { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .concepts { margin: 4px 0; padding-left: 22px; }
  .concepts li { margin: 0; }
  .msg { text-align: center; color: var(--muted); padding: 32px 8px; }
</style>
</head>
<body>
<main>
  <h1>Oldish Words Study</h1>
  <div class="switch" role="group" aria-label="View">
    <button type="button" id="btn-ev" aria-pressed="true">Evidence</button>
    <button type="button" id="btn-rg" aria-pressed="false">Wōdlund register</button>
    <button type="button" id="btn-gr" aria-pressed="false">Wōdlund syntax and grammar</button>
  </div>
  <section id="view-ev">
  <div class="controls">
    <input type="search" id="q" placeholder="Search all columns…" aria-label="Search all columns">
    <select id="era" aria-label="Filter by era"><option value="">All eras</option></select>
    <select id="status" aria-label="Filter by status"><option value="">All statuses</option></select>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <div id="results"></div>
  </section>
  <section id="view-rg" hidden>
    <div class="controls three">
      <input type="search" id="rq" placeholder="Search entry, concepts, notes…" aria-label="Search entry, concepts and notes" style="grid-column: 1 / -1">
      <select id="rtier" aria-label="Filter by tier"><option value="__all">All tiers</option><option value="__blank">Undecided (blank)</option></select>
      <select id="rstatus" aria-label="Filter by status"><option value="__all">All statuses</option><option value="__unset">Unset</option></select>
      <select id="rtype" aria-label="Filter by type"><option value="__all">All types</option></select>
    </div>
    <div class="count" id="rcount" aria-live="polite"></div>
    <div id="rresults"></div>
  </section>
  <section id="view-gr" hidden>
    <div class="controls">
      <input type="search" id="gq" placeholder="Search syntax and grammar…" aria-label="Search syntax and grammar" style="grid-column: 1 / -1">
    </div>
    <div class="count" id="gcount" aria-live="polite"></div>
    <div id="gresults"></div>
  </section>
</main>
<script>
(function () {
  var rows = [];
  var $q = document.getElementById("q"), $era = document.getElementById("era"),
      $status = document.getElementById("status"), $res = document.getElementById("results"),
      $count = document.getElementById("count");

  // Minimal RFC 4180 CSV parser (quoted fields, doubled quotes, embedded commas/newlines).
  function parseCSV(text) {
    var out = [], row = [], f = "", inQ = false, i, c;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else inQ = false; }
        else f += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(f); f = ""; out.push(row); row = [];
      } else f += c;
    }
    if (f !== "" || row.length) { row.push(f); out.push(row); }
    return out.filter(function (r) { return r.length > 1 || r[0] !== ""; });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function field(label, value, cls) {
    if (!value) return null;
    var d = el("div", "field" + (cls ? " " + cls : ""));
    if (label) { d.appendChild(el("b", "", label + " ")); }
    d.appendChild(document.createTextNode(value));
    return d;
  }

  // source_url: a link only if it is a web address; otherwise plain text. Built with DOM methods.
  function linkField(label, url) {
    if (!url) return null;
    var d = el("div", "field");
    d.appendChild(el("b", "", label + " "));
    if (/^https?:\/\//.test(url)) {
      var a = document.createElement("a");
      a.href = url;
      a.rel = "noopener noreferrer";
      a.textContent = url;
      d.appendChild(a);
    } else {
      d.appendChild(document.createTextNode(url));
    }
    return d;
  }

  function card(r) {
    var c = el("article", "card " + (r.status === "BUILD" ? "build" : "hit"));
    c.appendChild(el("div", "term", r.term));
    var meta = el("div", "meta");
    meta.appendChild(document.createTextNode([r.era, r.date].filter(Boolean).join(" · ") + (r.era || r.date ? " · " : "")));
    meta.appendChild(el("span", "badge", r.status));
    c.appendChild(meta);
    [field("Job", r.job), field("Definition", r.definition), field("Usage notes", r.usage_notes),
     field("", r.quote ? "“" + r.quote + "”" : "", "quote"),
     field("Source", r.source), field("Locator", r.locator),
     linkField("Source address", r.source_url)].forEach(function (n) { if (n) c.appendChild(n); });
    var foot = el("footer", "foot");
    foot.appendChild(el("div", "", r.last_verified_by
      ? "Last verified by " + r.last_verified_by + (r.last_verified_date ? ", " + r.last_verified_date : "")
      : "Not yet verified"));
    if (r.change_note) foot.appendChild(el("div", "", "Change note: " + r.change_note));
    c.appendChild(foot);
    return c;
  }

  // Compare in Unicode NFC so a typed accent matches the stored one however it is encoded.
  function norm(x) { return x.normalize("NFC").toLowerCase(); }

  function fillSelect(sel, key) {
    var seen = {};
    rows.forEach(function (r) { if (r[key]) seen[r[key]] = 1; });
    Object.keys(seen).sort().forEach(function (v) {
      var o = el("option", "", v); o.value = v; sel.appendChild(o);
    });
  }

  function render() {
    var q = norm($q.value.trim()), era = $era.value, st = $status.value;
    var hits = rows.filter(function (r) {
      if (era && r.era !== era) return false;
      if (st && r.status !== st) return false;
      return !q || Object.keys(r).some(function (k) { return norm(r[k]).indexOf(q) !== -1; });
    });
    $res.textContent = "";
    $count.textContent = rows.length ? hits.length + " of " + rows.length + " entries" : "";
    if (!hits.length) {
      $res.appendChild(el("div", "msg", rows.length
        ? "No matching entries. Try a different search or clear the filters."
        : "No entries yet."));
      return;
    }
    hits.forEach(function (r) { $res.appendChild(card(r)); });
  }

  fetch("entries.csv").then(function (resp) {
    if (!resp.ok) throw new Error(resp.status);
    return resp.text();
  }).then(function (text) {
    var t = parseCSV(text), head = t.shift() || [];
    rows = t.map(function (cells) {
      var o = {};
      head.forEach(function (h, i) { o[h.trim()] = cells[i] || ""; });
      return o;
    });
    fillSelect($era, "era"); fillSelect($status, "status");
    render();
    if (reg.length) renderReg();
  }).catch(function () {
    $res.appendChild(el("div", "msg",
      "Could not load entries.csv. If you opened this file directly from disk, serve the folder with a local web server instead."));
  });

  // ---- Wōdlund register view ----
  var reg = [], regLoaded = false;
  var $rq = document.getElementById("rq"), $rtier = document.getElementById("rtier"),
      $rstatus = document.getElementById("rstatus"), $rtype = document.getElementById("rtype"),
      $rres = document.getElementById("rresults"), $rcount = document.getElementById("rcount");

  function fillRegSelect(sel, key) {
    var seen = {};
    reg.forEach(function (r) { (key === "tier" ? (r[key] || "").split(";").map(function (s) { return s.trim(); }) : [r[key]]).forEach(function (v) { if (v) seen[v] = 1; }); });
    Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); })
      .forEach(function (v) { var o = el("option", "", v); o.value = v; sel.appendChild(o); });
  }

  function evidenceFor(id) {
    id = id.trim();
    for (var i = 0; i < rows.length; i++) if (rows[i].id.trim() === id) return rows[i];
    return null;
  }

  // One part of a word's card: a single register row (one dictionary entry, one part of speech).
  function partBlock(r) {
    var c = el("div", "part");
    var meta = [r.type, r.tier ? "Tier: " + r.tier : "Tier: undecided"];
    if (r.status) meta.push("Status: " + r.status);
    if (r.chapter) meta.push("Chapter: " + r.chapter);
    if (r.era_range) meta.push("Era: " + r.era_range);
    if (r.pos) meta.splice(1, 0, r.pos);
    c.appendChild(el("div", "meta", meta.join(" · ")));
    var ks = (r.concepts || "").split(";").map(function (s) { return s.trim(); }).filter(Boolean);
    if (ks.length) {
      var d = el("div", "field"); d.appendChild(el("b", "", "Concepts"));
      var ul = el("ul", "concepts");
      ks.forEach(function (k) { ul.appendChild(el("li", "", k)); });
      d.appendChild(ul); c.appendChild(d);
    }
    if (!r.entry_id.trim()) c.appendChild(el("div", "field note", "No evidence row yet"));
    else {
      var e = evidenceFor(r.entry_id);
      if (!e) c.appendChild(el("div", "field note", "Evidence row not found"));
      else [field("", e.quote ? "“" + e.quote + "”" : "", "quote"),
            field("Source", e.source), field("Locator", e.locator)]
        .forEach(function (n) { if (n) c.appendChild(n); });
    }
    var fl = featureLinks(r); if (fl) c.appendChild(fl);
    var n = field("Notes", r.notes); if (n) c.appendChild(n);
    return c;
  }

  // Parts of speech in the order they are shown inside a word's card: noun first.
  function posRank(p) {
    var first = fold((p || "").split(";")[0]);
    var i = ["noun", "verb", "adjective", "adverb"].indexOf(first);
    return i === -1 ? 4 : i;
  }

  // One card per word. Each part (register row) of the word is a section inside it.
  function wordBlock(word, list) {
    var c = el("article", "opt word");
    c.appendChild(el("div", "term", word));
    list.slice().sort(function (a, b) {
      return (posRank(a.pos) - posRank(b.pos)) || (parseFloat(a.reg_id) - parseFloat(b.reg_id)) || 0;
    }).forEach(function (r) { c.appendChild(partBlock(r)); });
    return c;
  }

  function renderReg() {
    var q = norm($rq.value.trim()), tier = $rtier.value, st = $rstatus.value, ty = $rtype.value;
    $rres.textContent = "";
    if (!reg.length) { $rcount.textContent = ""; $rres.appendChild(el("div", "msg", "No register entries yet.")); return; }
    var hits = reg.filter(function (r) {
      if (tier === "__blank" ? r.tier : (tier !== "__all" && (r.tier || "").split(";").map(function (s) { return s.trim(); }).indexOf(tier) === -1)) return false;
      if (st === "__unset" ? r.status : (st !== "__all" && r.status !== st)) return false;
      if (ty !== "__all" && r.type !== ty) return false;
      return !q || [r.concepts, r.entry, r.notes].some(function (v) { return norm(v).indexOf(q) !== -1; });
    });
    var order = [], groups = {}, names = {};
    hits.forEach(function (r) {
      var k = norm(r.entry.trim());
      if (!Object.prototype.hasOwnProperty.call(groups, k)) { groups[k] = []; order.push(k); names[k] = r.entry.trim(); }
      groups[k].push(r);
    });
    $rcount.textContent = hits.length + " of " + reg.length + " entries in " + order.length + " words";
    if (!hits.length) { $rres.appendChild(el("div", "msg", "No matching register entries. Try a different search or clear the filters.")); return; }
    // Alphabetical by word. Words that do not start with A-Z (after removing accents)
    // are listed last under "#".
    order.sort(function (a, b) { return alphaCompare(names[a], names[b]); });
    var letter = null;
    order.forEach(function (k) {
      var L = letterOf(names[k]);
      if (L !== letter) { letter = L; $rres.appendChild(el("h3", "letter", L)); }
      $rres.appendChild(wordBlock(names[k], groups[k]));
    });
  }

  function loadReg() {
    if (regLoaded) return; regLoaded = true;
    fetch("register.csv").then(function (resp) {
      if (!resp.ok) throw new Error(resp.status);
      return resp.text();
    }).then(function (text) {
      var t = parseCSV(text), head = t.shift() || [];
      reg = t.map(function (cells) {
        var o = {};
        head.forEach(function (h, i) { o[h.trim()] = cells[i] || ""; });
        ["reg_id","entry","concepts","type","pos","entry_id","tier","status","chapter","era_range","features","notes"]
          .forEach(function (k) { if (o[k] === undefined) o[k] = ""; });
        return o;
      });
      fillRegSelect($rtier, "tier"); fillRegSelect($rstatus, "status"); fillRegSelect($rtype, "type");
      renderReg();
    }).catch(function () {
      regLoaded = false;
      $rres.textContent = "";
      $rres.appendChild(el("div", "msg", "Could not load register.csv. If you opened this file directly from disk, serve the folder with a local web server instead."));
    });
  }

  // ---- Wōdlund syntax and grammar view ----
  var gram = [], gramLoaded = false;
  var $gq = document.getElementById("gq"), $gres = document.getElementById("gresults"),
      $gcount = document.getElementById("gcount");

  function gramById(id) {
    for (var i = 0; i < gram.length; i++) if (gram[i].gram_id.trim() === id) return gram[i];
    return null;
  }

  function gramBlock(r) {
    var c = el("article", "opt");
    c.setAttribute("data-gram", r.gram_id.trim());
    c.appendChild(el("div", "term", r.entry));
    var meta = [];
    if (r.chapter) meta.push("Chapter: " + r.chapter);
    if (r.era_range) meta.push("Era: " + r.era_range);
    if (meta.length) c.appendChild(el("div", "meta", meta.join(" · ")));
    var d = field("", r.description); if (d) c.appendChild(d);
    if (r.entry_id.trim()) {
      var e = evidenceFor(r.entry_id);
      if (!e) c.appendChild(el("div", "field note", "Evidence row not found"));
      else [field("", e.quote ? "“" + e.quote + "”" : "", "quote"),
            field("Source", e.source), field("Locator", e.locator)]
        .forEach(function (n) { if (n) c.appendChild(n); });
    }
    var n = field("Notes", r.notes); if (n) c.appendChild(n);
    return c;
  }

  function renderGram() {
    var q = norm($gq.value.trim());
    if (!gramLoaded) return;
    $gres.textContent = "";
    if (!gram.length) { $gcount.textContent = ""; $gres.appendChild(el("div", "msg", "No grammar entries yet.")); return; }
    var hits = gram.filter(function (r) {
      return !q || Object.keys(r).some(function (k) { return norm(r[k]).indexOf(q) !== -1; });
    });
    $gcount.textContent = hits.length + " of " + gram.length + " entries";
    if (!hits.length) { $gres.appendChild(el("div", "msg", "No matching grammar entries. Try a different search.")); return; }
    hits.forEach(function (r) { $gres.appendChild(gramBlock(r)); });
  }

  function loadGram() {
    fetch("grammar.csv").then(function (resp) {
      if (!resp.ok) throw new Error(resp.status);
      return resp.text();
    }).then(function (text) {
      var t = parseCSV(text), head = t.shift() || [];
      gram = t.map(function (cells) {
        var o = {};
        head.forEach(function (h, i) { o[h.trim()] = cells[i] || ""; });
        ["gram_id","entry","description","entry_id","chapter","era_range","notes"]
          .forEach(function (k) { if (o[k] === undefined) o[k] = ""; });
        return o;
      });
      gramLoaded = true;
      renderGram();
      if (reg.length) renderReg();
    }).catch(function () {
      $gres.textContent = "";
      $gres.appendChild(el("div", "msg", "Could not load grammar.csv. If you opened this file directly from disk, serve the folder with a local web server instead."));
    });
  }

  // Features in the register are gram_id values separated by semicolons, shown as links to the
  // matching rows in the grammar tab.
  function featureLinks(r) {
    var ids = (r.features || "").split(";").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!ids.length) return null;
    var d = el("div", "field");
    d.appendChild(el("b", "", "Features "));
    ids.forEach(function (id, i) {
      if (i) d.appendChild(document.createTextNode("; "));
      var g = gramById(id);
      if (g) {
        var a = document.createElement("a");
        a.href = "#gram-" + encodeURIComponent(id);
        a.textContent = g.entry || id;
        a.addEventListener("click", function (ev) { ev.preventDefault(); gotoGram(id); });
        d.appendChild(a);
      } else {
        d.appendChild(document.createTextNode(id + (gramLoaded ? " (grammar row not found)" : "")));
      }
    });
    return d;
  }

  function gotoGram(id) {
    $gq.value = "";
    show("gr");
    var nodes = $gres.querySelectorAll("[data-gram]");
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-gram") === id) {
        nodes[i].scrollIntoView();
        nodes[i].classList.add("flash");
        (function (n) { setTimeout(function () { n.classList.remove("flash"); }, 1800); })(nodes[i]);
        break;
      }
    }
  }

  // Sorting for the register: remove accents, lower-case, compare by code point.
  function fold(x) { return x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
  function letterOf(x) { var c = fold(x).charAt(0); return /[a-z]/.test(c) ? c.toUpperCase() : "#"; }
  function alphaCompare(a, b) {
    var la = letterOf(a), lb = letterOf(b);
    if (la !== lb) return la === "#" ? 1 : lb === "#" ? -1 : (la < lb ? -1 : 1);
    var fa = fold(a), fb = fold(b);
    return fa < fb ? -1 : fa > fb ? 1 : (a < b ? -1 : a > b ? 1 : 0);
  }

  var views = { ev: document.getElementById("view-ev"), rg: document.getElementById("view-rg"),
                gr: document.getElementById("view-gr") },
      btns = { ev: document.getElementById("btn-ev"), rg: document.getElementById("btn-rg"),
               gr: document.getElementById("btn-gr") };
  function show(which) {
    Object.keys(views).forEach(function (k) {
      views[k].hidden = k !== which; btns[k].setAttribute("aria-pressed", k === which ? "true" : "false");
    });
    if (which === "rg") { loadReg(); if (regLoaded && reg.length) renderReg(); }
    if (which === "gr") renderGram();
  }
  btns.ev.addEventListener("click", function () { show("ev"); });
  btns.rg.addEventListener("click", function () { show("rg"); });
  btns.gr.addEventListener("click", function () { show("gr"); });
  $gq.addEventListener("input", renderGram);
  loadGram();
  $rq.addEventListener("input", renderReg);
  $rtier.addEventListener("change", renderReg);
  $rstatus.addEventListener("change", renderReg);
  $rtype.addEventListener("change", renderReg);

  $q.addEventListener("input", render);
  $era.addEventListener("change", render);
  $status.addEventListener("change", render);
})();
</script>
</body>
</html>
