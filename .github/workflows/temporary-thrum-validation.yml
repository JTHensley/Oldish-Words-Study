name: Temporary thrum validation
on:
  push:
    branches: [temporary-check-thrum-20261027]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thrum PR
        uses: actions/checkout@v4
        with:
          ref: add-thrum-noun-verb-tier1-20261027
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Run repository validator
        run: python3 check.py --allow-file entries.csv --allow-file register.csv
