name: Temporary morrow CSV validation
on:
  push:
    branches: [morrow-validation-20261030]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morrow-oed-20261030
          fetch-depth: 0
      - name: Validate changes against main
        run: |
          git fetch origin main
          python3 check.py --allow-file entries.csv --allow-file register.csv
