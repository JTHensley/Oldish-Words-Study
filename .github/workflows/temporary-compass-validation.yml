name: Temporary compass data validation
on:
  push:
    branches: [compass-validation-20261030]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compass-verb-oed-20261030
          fetch-depth: 0
      - name: Validate CSV changes against main
        run: |
          git fetch origin main
          python3 check.py --allow-file entries.csv --allow-file register.csv
