    branches: [temporary-check-joy-20261028]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out joy branch
        uses: actions/checkout@v4
        with:
          ref: add-joy-verb-tier3-20261028
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Run repository validator
