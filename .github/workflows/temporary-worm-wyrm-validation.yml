name: Temporary worm wyrm Tier 4 validation
on:
  push:
    branches:
      - validate-worm-wyrm-tier4-20261029
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out worm wyrm data branch
        uses: actions/checkout@v4
        with:
          ref: register-worm-wyrm-tier4-20261029
          fetch-depth: 0
      - name: Fetch origin main
        run: git fetch origin main
      - name: Run repository check.py against main
        run: python3 check.py --allow-file entries.csv --allow-file register.csv
