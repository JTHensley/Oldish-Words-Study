name: Temporary boon Tier 1 corrected validation
on:
  push:
    branches:
      - validate-boon-tier1-recheck-20261029
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out proposed boon data branch
        uses: actions/checkout@v4
        with:
          ref: register-boon-tier1-20261029
          fetch-depth: 0
      - name: Fetch origin main
        run: git fetch origin main
      - name: Run original check.py against main
        run: python3 check.py --allow-file entries.csv --allow-file register.csv
