name: Temporary eld CSV validation
on:
  push:
    branches: [eld-validation-20261030]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eld-oed-20261030
          fetch-depth: 0
      - name: Check CSV additions
        run: |
          git fetch origin main
          python3 check.py --allow-file entries.csv --allow-file register.csv
