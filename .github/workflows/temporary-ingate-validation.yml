name: Temporary ingate CSV validation
on:
  push:
    branches: [ingate-validation-20261030]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingate-oed-20261030
          fetch-depth: 0
      - name: Check dataset
        run: |
          git fetch origin main
          python3 check.py --allow-file entries.csv --allow-file register.csv
