name: Temporary avow two-verb validation
on:
  push:
    branches:
      - validate-avow-two-verbs-20261029
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out proposed avow data branch
        uses: actions/checkout@v4
        with:
          ref: register-avow-tier3-20261029
          fetch-depth: 0
      - name: Fetch origin main
        run: git fetch origin main
      - name: Run original check.py against main
        run: python3 check.py --allow-file entries.csv --allow-file register.csv
