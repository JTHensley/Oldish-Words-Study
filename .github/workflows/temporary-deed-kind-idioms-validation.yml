name: Temporary historical idioms validation
on:
  push:
    branches:
      - validate-idioms-deed-kind-20261029
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out idioms working branch
        uses: actions/checkout@v4
        with:
          ref: register-idioms-in-very-deed-out-of-kind-20261029
          fetch-depth: 0
      - name: Fetch origin main
        run: git fetch origin main
      - name: Validate with original check.py
        run: python3 check.py --allow-file entries.csv --allow-file register.csv
