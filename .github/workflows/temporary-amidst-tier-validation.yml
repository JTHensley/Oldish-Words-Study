name: Temporary amidst tier validation
on:
  pull_request:
  push:
    branches: [temporary-check-amidst-tier1-20261028]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out amidst tier branch
        uses: actions/checkout@v4
        with:
          ref: set-amidst-tier1-20261028
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Run repository validator
        run: python3 check.py --allow-file register.csv

