name: Temporary astir validation
on:
  pull_request:
  push:
    branches: [temporary-check-astir-20261028]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out astir branch
        uses: actions/checkout@v4
        with:
          ref: add-astir-tier3-20261028
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Run repository validator
        run: python3 check.py --allow-file entries.csv --allow-file register.csv

