name: Temporary light v1 Tier 3 validation
on:
  push:
    branches:
      - validate-light-v1-tier3-20261029
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out proposed light-v1 data branch
        uses: actions/checkout@v4
        with:
          ref: register-light-v1-tier3-20261029
          fetch-depth: 0
      - name: Fetch origin main
        run: git fetch origin main
      - name: Run original check.py against main
        run: python3 check.py --allow-file entries.csv --allow-file register.csv
